name: Ready

on:
  push:
    branches: [ts-monorepo-ci, develop]
  pull_request:
    branches: [master, develop]

jobs:
  common-jobs:
    uses: ./.github/workflows/common-jobs.yml
    secrets:
      PLANETS_API: ${{ secrets.PLANETS_API }}
      STARSHIP_API: ${{ secrets.STARSHIP_API }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
