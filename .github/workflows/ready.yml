name: Ready
on:
  push:
    branches: [ts-monorepo-ci, develop]
  pull_request:
    branches: [master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"
      - name: Configure yarn
        run: yarn set version 4.3.1
      - name: Cache node_modules
        id: cache-nodemodules
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - run: yarn lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"
      - name: Configure yarn
        run: yarn set version 4.3.1
      - name: Cache node_modules
        id: cache-nodemodules
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Cache MongoDB binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ matrix.mongodb-version }}
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "4.0"
      - run: yarn codegen
      - run: yarn test

  cypress:
    runs-on: ubuntu-latest
    needs: lint
    env:
      VITE_API_URL: http://localhost:4000/graphql
      FE_URL: http://localhost:5000
      PLANETS_API: ${{ secrets.PLANETS_API }}
      STARSHIP_API: ${{ secrets.STARSHIP_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"
      - name: Configure yarn
        run: yarn set version 4.3.1
      - name: Cache node_modules
        id: cache-nodemodules
        uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-nodemodules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Cache MongoDB binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ matrix.mongodb-version }}
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "4.0"
      - name: Generate code
        run: yarn codegen
      - name: Start the project
        run: yarn start & echo $! > .pidfile
      - name: Wait for project to be ready
        run: |
          while ! nc -z localhost 5000; do
            sleep 1
          done
      - name: Run Cypress tests
        run: yarn cypress:run
        continue-on-error: true
        id: cypress
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: packages/client/cypress/screenshots
          if-no-files-found: warn
      - name: List screenshot directory
        if: always()
        run: ls -R packages/client/cypress/screenshots
      - name: Stop the project
        if: always()
        run: kill $(cat .pidfile)
      - name: Check Cypress result
        if: steps.cypress.outcome == 'failure'
        run: exit 1
