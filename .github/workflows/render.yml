name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [ts-monorepo-ci, develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.15.1"

      - uses: ./.github/actions/setup-yarn

      - name: Generate code
        run: yarn codegen

      - name: Build client
        run: yarn build:client

      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Wait for deployment and verify
        run: |
          echo "Deployment triggered, please verify at: https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com"
          sleep 60  # Wait for deployment to complete
          curl -f https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com
