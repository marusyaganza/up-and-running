name: Up and Running
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
jobs:
  build:
    env:
      CI: true
    strategy:
      matrix:
        node-versions: ["18"]
        mongodb-version: ["6.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: MongoDB in GitHub Actions version  ${{ matrix.mongodb-version }}
      - uses: medenizoren/mongodb-github-action@1.0.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Use Node version ${{ matrix.node-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: yarn deploy
      - run: yarn test
